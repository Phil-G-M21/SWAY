<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWAY — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=30"></script>
<script src="js/admin-guard.js?v=30"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f4f4f3; color:#0a0a0a; }
  .layout { display:flex; min-height:100vh; }
  /* Sidebar */
  .sidebar { width:220px; background:#0a0a0a; color:#fff; padding:24px 0; position:fixed; top:0; bottom:0; left:0; overflow-y:auto; z-index:50; transition:transform .25s; }
  .sb-logo { font-size:22px; font-weight:800; letter-spacing:.04em; padding:0 24px 24px; border-bottom:1px solid #222; }
  .sb-nav { padding:12px 0; }
  .sb-item { display:flex; align-items:center; gap:10px; padding:13px 24px; font-size:14px; color:#aaa; cursor:pointer; border:none; background:none; width:100%; text-align:left; font-weight:500; }
  .sb-item:hover { color:#fff; background:#161616; }
  .sb-item.active { color:#fff; background:#1a1a1a; border-left:3px solid #fff; padding-left:21px; }
  .sb-badge { background:#e74c3c; color:#fff; font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; margin-left:6px; }
  .sb-foot { padding:16px 24px; border-top:1px solid #222; margin-top:12px; }
  .sb-foot a, .sb-foot button { color:#888; font-size:12px; text-decoration:none; background:none; border:none; cursor:pointer; display:block; padding:6px 0; text-align:left; }
  .sb-foot a:hover, .sb-foot button:hover { color:#fff; }
  /* Main */
  .main { flex:1; margin-left:220px; padding:28px 32px; max-width:100%; }
  .page-head { font-size:26px; font-weight:800; letter-spacing:.02em; margin-bottom:4px; }
  .page-sub { color:#666; font-size:14px; margin-bottom:24px; }
  .hamburger { display:none; position:fixed; top:16px; left:16px; z-index:60; background:#0a0a0a; color:#fff; border:none; width:44px; height:44px; border-radius:8px; font-size:20px; cursor:pointer; }
  .sb-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:40; }
  .section { display:none; }
  .section.active { display:block; }
  /* shared */
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#0a0a0a; color:#fff; padding:14px 24px; border-radius:6px; font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:100; }
  .toast.show { opacity:1; }
  .btn { border:none; padding:11px 18px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn-add { background:#1a7f4b; color:#fff; }
  .btn-ghost { background:#fff; border:1px solid #ddd; color:#333; }
  .toolbar { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  /* stat cards */
  .stat-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
  .stat-card { background:#fff; border:1px solid #e5e5e4; border-radius:10px; padding:20px; }
  .stat-num { font-size:28px; font-weight:800; letter-spacing:-.01em; }
  .stat-label { font-size:12px; color:#888; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; font-weight:600; }
  @media (max-width:860px){
    .sidebar { transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; padding:70px 18px 40px; }
    .hamburger { display:block; }
    .sb-overlay.open { display:block; }
    .sb-logo { padding-left:70px; }
  }
</style>
<link rel="stylesheet" href="css/admin.css?v=30">
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="sb-overlay" id="sb-overlay" onclick="toggleSidebar()"></div>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">SWAY</div>
    <nav class="sb-nav">
      <button class="sb-item active" onclick="adminNav('orders',this)">Orders <span class="sb-badge" id="orders-badge" style="display:none">0</span></button>
      <button class="sb-item" onclick="adminNav('inventory',this)">Inventory</button>
      <button class="sb-item" onclick="adminNav('finance',this)">Finance</button>
      <button class="sb-item" onclick="adminNav('products',this)">Products</button>
      <button class="sb-item" onclick="adminNav('addseries',this)">Add Series</button>
      <button class="sb-item" onclick="adminNav('siteimages',this)">Site Images</button>
    </nav>
    <div class="sb-foot">
      <a href="index.html">← View store</a>
      <button onclick="adminSignOut()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <!-- Sections injected/here -->
    <div class="section active" id="sec-orders"></div>
    <div class="section" id="sec-inventory"></div>
    <div class="section" id="sec-finance"></div>
    <div class="section" id="sec-products"></div>
    <div class="section" id="sec-addseries"></div>
    <div class="section" id="sec-siteimages"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="js/admin-app.js?v=30"></script>
</body>
</html>
